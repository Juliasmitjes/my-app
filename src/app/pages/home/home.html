<section class="relative min-h-[100vh] flex items-center overflow-hidden bg-primary">

  <!-- achtergrond met depth en glow -->
  <div
    class="absolute inset-0 bg-cover bg-center scale-105 animate-[slowZoom_30s_ease-in-out_infinite_alternate]"
    style="background-image: url('assets/images/background.jpg')"
  >
    <div class="absolute inset-0 bg-gradient-to-br from-primary/90 via-primary/85 to-accent/70 mix-blend-multiply"></div>
  </div>

  <div class="absolute top-0 right-[-5%] h-full w-[30%] bg-accent/15 backdrop-blur-sm transform -skew-x-12 shadow-xl hidden lg:flex flex-col justify-center items-center space-y-10">
    <div class="transform skew-x-12 text-center space-y-2">
      <div class="text-5xl font-extrabold text-accent">100%</div>
      <p class="text-sm text-primary-foreground/90">Maatwerk<br><span class="font-semibold text-primary/60">Elke site uniek</span></p>
    </div>
    <div class="transform skew-x-12 text-center space-y-2">
      <div class="text-5xl font-extrabold text-accent">7</div>
      <p class="text-sm text-primary-foreground/90">Dagen support<br><span class="font-semibold text-primary/60">Altijd bereikbaar</span></p>
    </div>
    <div class="transform skew-x-12 text-center space-y-2">
      <div class="text-5xl font-extrabold text-accent">5</div>
      <p class="text-sm text-primary-foreground/90">Minuten<br><span class="font-semibold text-primary/60">Om te bouwen</span></p>
    </div>
  </div>

  <!-- content -->
  <div class="relative z-10 container mx-auto px-6 py-24 flex flex-col md:flex-row items-center gap-12">

    <!-- tekstblok -->
    <div class="flex-1 text-center md:text-left space-y-8 max-w-xl">
      <div class="inline-block px-4 py-2 bg-accent/20 rounded-full text-accent font-semibold">
        <span class="text-3xl font-extrabold text-primary-foreground tracking-tight"> Build<span class="text-accent">Buddy</span> </span>
      </div>

      <h1 class="text-5xl md:text-6xl lg:text-7xl font-extrabold text-primary-foreground leading-tight">
        Jouw website
        <span class="block text-transparent bg-clip-text bg-gradient-to-r from-accent via-primary to-accent animate-gradient-x">
          in 5 stappen
        </span>
      </h1>

      <p class="text-lg md:text-xl text-primary-foreground/90 leading-relaxed">
        Snel, simpel én betaalbaar: jouw professionele website.  
        <span class="text-accent font-semibold">Perfect voor starters en kleine ondernemers.</span>
      </p>

      <div class="pt-4">
        <app-button
          variant="hero"
          size="lg"
          class="cursor-pointer transition-transform hover:scale-105 shadow-xl"
          (click)="scrollToServices()"
        >
          Aan de slag
          <lucide-icon name="arrow-down" class="ml-2 h-5 w-5"></lucide-icon>
        </app-button>
      </div>
    </div>

    <div class="hidden flex-1 relative lg:flex justify-center items-end">
      <img
        src="assets/images/uil4.png"
        alt="BuildBuddy"
        class="w-64 absolute -bottom-98 right-80 md:w-80 drop-shadow-2xl animate-bounce-slow"
      />
    </div>

  </div>
</section>

<app-services id="services" class="block w-full"></app-services>

<app-footer id="footer" class="block w-full"></app-footer>
