<section class="relative min-h-[90vh] flex items-center justify-center overflow-hidden">

  <!-- achtergrondafbeelding -->
  <div
    class="absolute inset-0 z-0 bg-cover bg-center"
    style="background-image: url('assets/images/background.jpg')"
  >
    <div class="absolute inset-0 bg-primary/90"></div>
  </div>

  <!-- content -->
  <div class="container relative z-10 px-4 py-20 mx-auto text-center">
    <div class="max-w-4xl mx-auto space-y-8">
      <div class="text-center mb-15">
        <span class="text-3xl font-extrabold text-primary-foreground tracking-tight">
          Build<span class="text-accent">Buddy</span>
        </span>
      </div>

      <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold text-primary-foreground leading-tight">
        Bouw jouw website
        <span class="block mt-2 text-gradient-accent bg-clip-text">In 5 stappen</span>
      </h1>

      <p class="text-xl md:text-2xl text-primary-foreground/90 max-w-2xl mx-auto">
        Snel, simpel én betaalbaar: jouw professionele website. Perfect voor starters en kleine ondernemers.
      </p>

      <!-- buttons -->
      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center pt-4">
        <app-button
          variant="hero"
          size="lg"
          class="w-full sm:w-auto cursor-pointer"
          (click)="scrollToServices()"
        >
          Website bouwen
          <lucide-icon name="arrow-down" class="ml-2 h-5 w-5"></lucide-icon>
        </app-button>

        <app-button
          variant="outline-hero"
          size="lg"
          class="w-full sm:w-auto cursor-pointer"
          (click)="scrollToServices()"
        >
          Onze diensten
        </app-button>
      </div>

      <!-- waarden -->
      <div
        class="pt-12 grid grid-cols-3 gap-8 max-w-3xl mx-auto border-t border-primary-foreground/20 mt-12"
      >
        <div class="text-center space-y-1">
          <div class="text-3xl md:text-4xl font-bold text-accent">100%</div>
          <div class="text-sm text-primary-foreground/80 mt-1">
            Maatwerk.<br />
            <span class="font-semibold text-accent/80">Elke website uniek.</span>
          </div>
        </div>

        <div class="text-center space-y-1">
          <div class="text-3xl md:text-4xl font-bold text-accent">7</div>
          <div class="text-sm text-primary-foreground/80 mt-1">
            Dagen support.<br />
            <span class="font-semibold text-accent/80">Geen wachttijden.</span>
          </div>
        </div>

        <div class="text-center space-y-1">
          <div class="text-3xl md:text-4xl font-bold text-accent">5</div>
          <div class="text-sm text-primary-foreground/80 mt-1">
            Minuten.<br />
            <span class="font-semibold text-accent/80">Zo snel kun je starten.</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-services id="services" class="block w-full"></app-services>
