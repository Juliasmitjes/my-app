<section class="relative min-h-[100vh] flex items-center overflow-hidden bg-primary home-hero-shell">

  <!-- achtergrond met depth en glow -->
  <div
    class="absolute inset-0 bg-cover bg-center scale-105 animate-[slowZoom_30s_ease-in-out_infinite_alternate] hero-image-layer"
    style="background-image: url('assets/images/background.jpg')"
  >
    <div class="absolute inset-0 hero-image-overlay"></div>
  </div>

  <div class="hero-side-panel hidden xl:flex">
    <div class="hero-side-panel__inner">
      <div class="hero-metric">
        <div class="hero-metric__value">100%</div>
        <p class="hero-metric__label">Maatwerk</p>
        <p class="hero-metric__sub">Elke site uniek</p>
      </div>
      <div class="hero-metric">
        <div class="hero-metric__value">7</div>
        <p class="hero-metric__label">Dagen support</p>
        <p class="hero-metric__sub">Altijd bereikbaar</p>
      </div>
      <div class="hero-metric">
        <div class="hero-metric__value">5</div>
        <p class="hero-metric__label">Minuten</p>
        <p class="hero-metric__sub">Om te bouwen</p>
      </div>
    </div>
  </div>

  <!-- content -->
  <div class="relative z-10 container mx-auto px-6 py-10 md:py-14 xl:py-16 2xl:py-24 flex flex-col md:flex-row items-center gap-8 lg:gap-10 xl:gap-12">

    <!-- tekstblok -->
    <div class="flex-1 text-center md:text-left space-y-6 lg:space-y-8 max-w-xl hero-copy-card">
      <div class="inline-block px-4 py-2 bg-accent/10 rounded-full text-accent font-semibold border border-border/60">
        <span class="text-2xl md:text-3xl font-extrabold text-foreground tracking-tight"> With<span class="text-accent">Smith</span> </span>
      </div>

      <h1 class="text-4xl sm:text-5xl lg:text-6xl 2xl:text-7xl font-extrabold text-foreground leading-tight">
        Jouw website
        <span class="block text-transparent bg-clip-text bg-gradient-to-r from-accent via-primary to-accent animate-gradient-x">
          in 4 stappen
        </span>
      </h1>

      <p class="text-base sm:text-lg xl:text-xl text-foreground/85 leading-relaxed">
        Snel, simpel én betaalbaar: jouw professionele website.  
        <span class="text-accent font-semibold">Perfect voor starters en kleine ondernemers.</span>
      </p>

      <div class="pt-4">
        <app-button
          variant="hero"
          size="lg"
          class="cursor-pointer text-white transition-transform hover:scale-105 shadow-xl 2xl:text-lg"
          (click)="scrollToServices()"
        >
          Aan de slag
          <lucide-icon name="arrow-down" class="ml-2 h-4 w-5"></lucide-icon>
        </app-button>
      </div>
    </div>

  </div>
</section>

<section id="services" class="block w-full">
  @defer (on viewport) {
    <div class="services-shell-wrap">
      <app-services class="block w-full"></app-services>
    </div>
  } @placeholder {
    <div class="min-h-[400px]"></div>
  }
</section>

<app-footer id="footer" class="block w-full"></app-footer>
