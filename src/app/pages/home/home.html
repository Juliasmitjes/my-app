<section class="home-hero-shell">
  <header class="home-topbar">
    <div class="home-topbar__inner">
      <p class="home-brand">WithSmith</p>
      <p class="home-kicker">Website studio</p>
    </div>
  </header>

  <div class="home-hero-content">
    <h1 class="home-title">
      Strak design,
      <span>snel live.</span>
    </h1>
    <p class="home-subtitle">
      Jouw professionele website in 5 stappen. 
    </p>

    <div class="home-actions">
      <app-button
        variant="hero"
        size="lg"
        [buttonClass]="'home-primary-btn hover:scale-100 active:scale-100'"
        (click)="scrollToServices()"
      >
        Start project
      </app-button>

      <app-button
        variant="outline"
        size="lg"
        [buttonClass]="'home-secondary-btn hover:scale-100 active:scale-100'"
        (click)="scrollToContact()"
      >
        Plan gesprek
      </app-button>
    </div>

    <div class="hero-preview-wrap">
      <div class="hero-preview" aria-hidden="true">
        <div class="web-canvas">
          <div class="web-canvas__bar">
            <span></span><span></span><span></span>
            <div class="web-canvas__url"></div>
          </div>

          <div class="web-canvas__body">
            <aside class="web-sidebar">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </aside>

            <section class="web-content">
              <div class="web-hero"></div>
              <div class="web-lines">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <div class="web-cards">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </section>
          </div>
        </div>

        <div class="mobile-canvas">
          <div class="mobile-canvas__notch"></div>
          <div class="mobile-canvas__hero"></div>
          <div class="mobile-canvas__lines">
            <span></span>
            <span></span>
          </div>
          <div class="mobile-canvas__card"></div>
        </div>
      </div>
      
    </div>
  </div>
</section>

<section id="services" class="block w-full">
  @defer (on viewport) {
    <div class="services-shell-wrap">
      <app-services class="block w-full"></app-services>
    </div>
  } @placeholder {
    <div class="min-h-[400px]"></div>
  }
</section>

<app-footer id="footer" class="block w-full"></app-footer>
