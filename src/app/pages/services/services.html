<section class="py-16 bg-secondary">

  <!-- stappen -->
  <app-progress [currentStep]="currentStep" [steps]="steps"></app-progress>

  <div class="mb-8">
    @switch (currentStep) {
      @case (0) {
        <app-layout-step
          [builderState]="builderState"
          (update)="updateState($event)">
        </app-layout-step>
      }

      @case (1) {
        <app-color-step
          [builderState]="builderState"
          [themes]="colorThemes"
          (update)="updateState($event)">
        </app-color-step>
      }

      @case (2) {
        <app-font-step
          [builderState]="builderState"
          [fonts]="fontOptions"
          (update)="updateState($event)">
        </app-font-step>
      }

      @case (3) {
        <app-navigation-step
          [builderState]="builderState"
          (update)="updateState($event)">
        </app-navigation-step>
      }

      @case (4) {
        <app-content-step
          [builderState]="builderState"
          (update)="updateState($event)">
        </app-content-step>
      }

      @case (5) {
        <app-preview-step
          [builderState]="builderState">
        </app-preview-step>
      }
    }
  </div>

  <!-- navigatie -->
  <div class="flex justify-between">
    <button
      class="btn btn-outline"
      (click)="prevStep()"
      [disabled]="currentStep === 0">
      Previous
    </button>

    <button
      class="btn btn-primary"
      (click)="nextStep()"
      [disabled]="currentStep === steps.length - 1">
      {{ currentStep === steps.length - 2 ? 'Review' : 'Next' }}
    </button>
  </div>

</section>
