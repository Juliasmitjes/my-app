<div class="space-y-8 w-full max-w-5xl mx-auto px-4 sm:px-6">
  <!-- Titel -->
  <div class="text-center space-y-2">
    <h2 class="text-3xl font-bold">Kies jouw lettertype</h2>

  </div>

  <!-- Input voor voorbeeldtekst -->
  <div class="max-w-xl mx-auto">
    <input
      type="text"
      [(ngModel)]="userSampleText"
      (ngModelChange)="userSampleTextChange.emit($event)"
      class="w-full px-4 py-3 rounded-xl border border-border bg-white/80
             focus:outline-none ring-2 ring-accent/30 focus:ring-accent
             transition-all text-center text-md placeholder:text-muted-foreground/70"
      placeholder="Typ een voorbeeldtekst om het lettertype te beoordelen"
    />
  </div>

  <!-- Font preview blok -->
  <section
    class="p-6 sm:p-10 rounded-3xl
           bg-white
           border border-border/40
           shadow-sm
           transition-all
           md:shadow-xl"
  >

    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-6">
      <div class="inline-flex rounded-xl border border-border/60 bg-white/70 p-1">
        <button
          type="button"
          class="px-4 py-2 text-sm font-semibold rounded-lg transition-all cursor-pointer"
          [class.bg-accent]="selectionTarget === 'headings'"
          [class.text-accent-foreground]="selectionTarget === 'headings'"
          (click)="setTarget('headings')"
        >
          Kopjes
        </button>
        <button
          type="button"
          class="px-4 py-2 text-sm font-semibold rounded-lg transition-all cursor-pointer"
          [class.bg-accent]="selectionTarget === 'body'"
          [class.text-accent-foreground]="selectionTarget === 'body'"
          (click)="setTarget('body')"
        >
          Hoofdtekst
        </button>
      </div>
      <div class="text-xs text-muted-foreground text-center sm:text-right">
        Kopjes: <span class="font-semibold text-foreground">{{ headingName }}</span>
        · Hoofdtekst: <span class="font-semibold text-foreground">{{ bodyName }}</span>
      </div>
    </div>

    <!-- GRID alleen op desktop -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">

      @for (variant of fontVariants; track variant.id) {
        <div
          class="group cursor-pointer px-4 py-5 rounded-xl border border-border/30
                 bg-white/60 dark:bg-muted/30
                 transition-all duration-300
                 hover:bg-white hover:shadow-lg hover:-translate-y-1
                 md:hover:scale-[1.015]"
          [class.scale-[1.02]]="isSelected(variant.id)"
          [class.shadow-xl]="isSelected(variant.id)"
          [class.ring-2]="isSelected(variant.id)"
          [class.ring-accent]="isSelected(variant.id)"
          (click)="onSelectVariant(variant.id)"
          role="button"
          tabindex="0"
          (keydown.enter)="onSelectVariant(variant.id)"
          (keydown.space)="onSelectVariant(variant.id)"
          aria-pressed="{{ isSelected(variant.id) }}"
        >
          <div class="flex items-center justify-between text-xs uppercase tracking-wide text-muted-foreground mb-2">
            <span>{{ variant.name }}</span>
            <div class="flex items-center gap-1">
              @if (isHeadingSelected(variant.id)) {
                <span class="px-2 py-0.5 rounded-full bg-accent/15 text-accent text-[10px] font-semibold ">
                  Kopjes
                </span>
              }
              @if (isBodySelected(variant.id)) {
                <span class="px-2 py-0.5 rounded-full bg-muted text-foreground text-[10px] font-semibold">
                  Hoofdtekst
                </span>
              }
            </div>
          </div>
          <!-- Voorbeeldtekst -->
          <p
            class="text-lg md:text-xl leading-relaxed text-foreground"
            [ngStyle]="{ 'font-family': fontMap[variant.id] }"
          >
            {{ userSampleText || variant.sample }}
          </p>
        </div>
      }

    </div>
  </section>
</div>
