<div class="space-y-16 w-full max-w-5xl mx-auto px-4 sm:px-6">
  <!-- Titel -->
  <div class="text-center space-y-2">
    <h2 class="text-3xl font-bold">Kies jouw lettertype</h2>
    <p class="text-muted-foreground text-base">
      Bekijk hoe elke stijl jouw merkgevoel versterkt
    </p>
  </div>

  <!-- Input voor voorbeeldtekst -->
  <div class="max-w-xl mx-auto mt-6">
    <input
      type="text"
      [(ngModel)]="userSampleText"
      (ngModelChange)="userSampleTextChange.emit($event)"
      class="w-full px-4 py-3 rounded-xl border border-border bg-white/80
             focus:outline-none ring-2 ring-accent/30 focus:ring-accent
             transition-all text-center text-md placeholder:text-muted-foreground/70"
      placeholder="Typ hier jouw tekst..."
    />
  </div>

  <!-- Font preview blok -->
  <section
    class="p-6 sm:p-10 rounded-3xl bg-white/70 backdrop-blur-sm 
           border border-border/40 shadow-sm space-y-8 transition-all"
  >

    <!-- Fonts onder elkaar -->
    @for (variant of fontVariants; track variant.id) {
      <div
        class="group cursor-pointer transition-all duration-300 px-3 py-4 rounded-xl
               hover:bg-white/60 hover:shadow-md hover:scale-[1.02]"
        [class.scale-[1.02]]="isSelected(variant.id)"
        [class.shadow-lg]="isSelected(variant.id)"
        [class.ring-2]="isSelected(variant.id)"
        [class.ring-accent]="isSelected(variant.id)"
        (click)="onSelectVariant(variant.id)"
        role="button"
        tabindex="0"
        (keydown.enter)="onSelectVariant(variant.id)"
        (keydown.space)="onSelectVariant(variant.id)"
        aria-pressed="{{ isSelected(variant.id) }}"
      >
        <!-- Voorbeeldtekst in font -->
        <p class="text-lg sm:text-xl leading-relaxed text-foreground"
           [ngStyle]="{ 'font-family': fontMap[variant.id] }">
          {{ userSampleText || variant.sample }}
        </p>
      </div>
    }
  </section>
</div>
