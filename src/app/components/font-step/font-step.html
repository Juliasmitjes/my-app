<div class="step-container flex flex-col items-center space-y-12">
  <!-- Titel -->
  <div class="text-center">
    <h2 class="text-2xl font-bold mb-2">Kies jouw lettertype</h2>
    <p class="text-muted-foreground">Vind de stijl die bij jouw merk past</p>
  </div>

  <!-- Gridcontainer -->
  <div class="w-full flex flex-col items-center space-y-12">
    @for (style of fontStyles; track style.id) {
      <div class="w-full space-y-6">
        <!-- Sectietitel -->
        <div class="text-center">
          <h3 class="text-lg font-semibold text-foreground mb-1">{{ style.name }}</h3>
          <p class="text-sm text-muted-foreground">{{ style.description }}</p>
        </div>

        <!-- Grid: gecentreerd + bredere kaarten -->
        <div
          class="grid gap-8 justify-center"
          style="grid-template-columns: repeat(auto-fit, minmax(280px, 340px));"
        >
          @for (variant of style.variants; track variant.id) {
            <div
              class="relative group p-6 rounded-3xl cursor-pointer transition-all duration-300 flex flex-col items-center text-center space-y-4
                     bg-white/70 dark:bg-muted/30 backdrop-blur-sm border border-border/40
                     hover:shadow-lg hover:scale-[1.02]"
              [class.scale-[1.02]]="isSelected(style.id, variant.id)"
              [class.shadow-lg]="isSelected(style.id, variant.id)"
              [class.bg-primary/5]="isSelected(style.id, variant.id)"
              (click)="onSelectVariant(style.id, variant.id)"
              role="button"
              tabindex="0"
              (keydown.enter)="onSelectVariant(style.id, variant.id)"
              (keydown.space)="onSelectVariant(style.id, variant.id)"
              aria-pressed="{{ isSelected(style.id, variant.id) }}"
            >
              <!-- Mockup preview -->
              <div
                class="rounded-xl p-5 shadow-sm bg-white/80 dark:bg-background/40 transition-all duration-300 w-full"
                [class.ring-2]="isSelected(style.id, variant.id)"
                [class.ring-accent]="isSelected(style.id, variant.id)"
              >
                <h4
                  class="text-xl font-semibold mb-2 tracking-tight text-foreground"
                  [ngStyle]="{'font-family': variant.id}"
                >
                  {{ variant.name }}
                </h4>
                <p
                  class="text-sm text-muted-foreground leading-relaxed"
                  [ngStyle]="{'font-family': variant.id}"
                >
                  {{ variant.sample }}
                </p>
              </div>

              <!-- Subtiele accentlijn -->
              <div
                class="h-1 w-2/3 mt-4 rounded-full transition-all duration-300"
                [style.background]="isSelected(style.id, variant.id) ? 'var(--accent)' : 'transparent'">
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
