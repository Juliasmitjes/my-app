<div class="fixed top-4 right-4 z-50 space-y-3 w-72">

  @for (t of ((toast.messages$ | async) ?? []); track t.id) {
    <div
      class="px-4 py-3 rounded-xl shadow-lg text-white flex items-center gap-3 animate-fade-in cursor-pointer"
      [ngClass]="{
        'bg-green-600': t.type === 'success',
        'bg-red-600': t.type === 'error',
        'bg-blue-600': t.type === 'info'
      }"
      (click)="toast.remove(t.id)"
    >
      <lucide-icon
        [name]="
          t.type === 'success'
            ? 'check-circle'
            : t.type === 'error'
            ? 'x-circle'
            : 'info'
        "
        class="w-5 h-5"
      ></lucide-icon>

      <span class="flex-1">{{ t.text }}</span>
    </div>
  }
  @empty {
    <!-- niks -->
  }

</div>
