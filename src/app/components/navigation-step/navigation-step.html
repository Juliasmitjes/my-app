<div class="animate-fade-in space-y-8">
  <!-- Titel & Intro -->
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold mb-2">Navigation & Header</h2>
    <p class="text-muted-foreground">Configure your site's navigation and branding</p>
  </div>

  <!-- LOGO INPUT -->
  <div>
    <label for="logo" class="text-base font-semibold mb-2 block">
      Site Name / Logo
    </label>
    <input
      id="logo"
      type="text"
      class="max-w-md w-full border rounded-lg p-2 focus:ring-2 focus:ring-primary outline-none transition"
      placeholder="Enter your site name..."
      [value]="builderState.logo || ''"
      (input)="onLogoChange($event)"
    />
  </div>

  <!-- NAVIGATION STYLE -->
  <div>
    <label class="text-base font-semibold mb-3 block">Navigation Style</label>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl">
      <app-option-card
        [layout]="{
          id: 'top',
          name: 'Top Navigation',
          description: 'Standard horizontal menu',
          icon: 'menu'
        }"
        [selected]="builderState.navigation === 'top'"
        (select)="updateState({ navigation: 'top' })">
      </app-option-card>

      <app-option-card
        [layout]="{
          id: 'sidebar',
          name: 'Sidebar Navigation',
          description: 'Vertical side menu',
          icon: 'sidebar'
        }"
        [selected]="builderState.navigation === 'sidebar'"
        (select)="updateState({ navigation: 'sidebar' })">
      </app-option-card>
    </div>
  </div>

  <!-- HEADER STYLE -->
  <div>
    <label class="text-base font-semibold mb-3 block">Header Style</label>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl">
      <app-option-card
        [layout]="{
          id: 'fixed',
          name: 'Fixed Header',
          description: 'Stays at top while scrolling'
        }"
        [selected]="builderState.headerStyle === 'fixed'"
        (select)="updateState({ headerStyle: 'fixed' })">
      </app-option-card>

      <app-option-card
        [layout]="{
          id: 'scrolling',
          name: 'Scrolling Header',
          description: 'Scrolls with page content'
        }"
        [selected]="builderState.headerStyle === 'scrolling'"
        (select)="updateState({ headerStyle: 'scrolling' })">
      </app-option-card>
    </div>
  </div>
</div>
