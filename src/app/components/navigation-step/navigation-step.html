<div className="space-y-6">
  <div className="text-center mb-8">
    <h2 className="text-2xl font-bold mb-2">Navigation & Header</h2>
    <p className="text-muted-foreground">Configure your site's navigation and branding</p>
  </div>
  
  <app-card>
    <app-card-header>
      <app-card-title class="flex items-center gap-2">
        <!-- hier evt een iconcomponent plaatsen -->
        <span>Logo & Navigation</span>
      </app-card-title>
    </app-card-header>

   <app-card-content class="space-y-6">
      <!-- LOGO INPUT -->
      <div>
        <label for="logo" class="font-semibold block mb-1">Logo Text</label>
        <input
          id="logo"
          type="text"
          placeholder="Enter your business name or logo text"
          class="mt-2 border rounded p-2 w-full"
          [value]="builderState.logo"
          (input)="updateState({ logo: $any($event.target).value })"
        />
      </div>

      <!-- NAVIGATION STYLE -->
      <div class="space-y-4">
        <label class="font-semibold">Navigation Style</label>
        <div class="grid md:grid-cols-2 gap-4">
          <app-option-card
            title="Top Navigation"
            description="Classic horizontal menu"
            [selected]="builderState.navigation === 'top'"
            (click)="updateState({ navigation: 'top' })"
          ></app-option-card>

          <app-option-card
            title="Sidebar Navigation"
            description="Vertical side menu"
            [selected]="builderState.navigation === 'sidebar'"
            (click)="updateState({ navigation: 'sidebar' })"
          ></app-option-card>
        </div>
      </div>

      <!-- HEADER STYLE -->
      <div class="space-y-4">
        <label class="font-semibold">Header Style</label>
        <div class="grid md:grid-cols-2 gap-4">
          <app-option-card
            title="Fixed Header"
            description="Stays visible when scrolling"
            [selected]="builderState.headerStyle === 'fixed'"
            (click)="updateState({ headerStyle: 'fixed' })"
          ></app-option-card>

          <app-option-card
            title="Scrolling Header"
            description="Scrolls with the page"
            [selected]="builderState.headerStyle === 'scrolling'"
            (click)="updateState({ headerStyle: 'scrolling' })"
          ></app-option-card>
        </div>
      </div>
    </app-card-content>
  </app-card>
</div>
