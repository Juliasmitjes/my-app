@if(visible){
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <!-- Kaart -->
    <div
      class="w-full max-w-md mx-auto bg-white/60 dark:bg-muted/30 backdrop-blur-sm border border-border/50 rounded-3xl p-8 shadow-lg flex flex-col"
    >

    <button
        type="button"
        (click)="onDismiss()"
        class="absolute top-4 right-4 text-muted-foreground hover:text-accent transition cursor-pointer"
        aria-label="Popup sluiten"
      >
        <lucide-icon name="x" class="w-6 h-6"></lucide-icon>
      </button>

      <!-- Titel -->
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-foreground mb-2">Aanvraag versturen</h2>
        <p class="text-md text-white ">
          Eenmalige bouwkosten: <strong>€250</strong><br>
          Maandelijkse servicekosten: <strong>€50</strong>
        </p>
      </div>

      <!-- Formulier -->
      <form (ngSubmit)="sendRequest()" class="space-y-4">
        <input
          type="text"
          [(ngModel)]="form.name"
          name="name"
          placeholder="Naam"
          required
          class="w-full px-4 py-2 rounded-xl border border-border/50 bg-background/40 focus:outline-none focus:ring-2 focus:ring-accent transition"
        />

        <input
          type="text"
          [(ngModel)]="form.company"
          name="company"
          placeholder="Bedrijf (optioneel)"
          class="w-full px-4 py-2 rounded-xl border border-border/50 bg-background/40 focus:outline-none focus:ring-2 focus:ring-accent transition"
        />

        <input
          type="email"
          [(ngModel)]="form.email"
          name="email"
          placeholder="Emailadres"
          required
          class="w-full px-4 py-2 rounded-xl border border-border/50 bg-background/40 focus:outline-none focus:ring-2 focus:ring-accent transition"
        />

        <input
          type="tel"
          [(ngModel)]="form.phone"
          name="phone"
          placeholder="Telefoonnummer (optioneel)"
          class="w-full px-4 py-2 rounded-xl border border-border/50 bg-background/40 focus:outline-none focus:ring-2 focus:ring-accent transition"
        />

        <textarea
          [(ngModel)]="form.message"
          name="message"
          placeholder="Bericht (optioneel)"
          rows="4"
          class="w-full px-4 py-2 rounded-xl border border-border/50 bg-background/40 focus:outline-none focus:ring-2 focus:ring-accent transition resize-none"
        ></textarea>

        <!-- Knop -->
        <button
          type="submit"
          class="w-full mt-4 px-4 py-2 bg-accent text-white rounded-xl font-semibold shadow-sm hover:bg-accent/90 transition cursor-pointer"
        >
          Verstuur aanvraag
        </button>
      </form>
    </div>
  </div>
}
