<div
  class="grid w-full max-w-4xl mx-auto py-6"
  [style.gridTemplateColumns]="'repeat(' + steps.length + ', 1fr)'"
>
  @for (step of steps; track step; let i = $index) {

    @if (i < steps.length - 1) {
      <!-- Normale stap -->
      <div class="flex flex-col items-center relative">
        <!-- Rondje -->
        <div
          class="flex items-center justify-center w-12 h-12 rounded-full font-semibold text-base transition-all duration-300 border-2 border-transparent"
          [class.bg-green-500]="i < currentStep"
          [class.text-white]="i <= currentStep"
          [class.bg-accent]="i === currentStep"
          [class.shadow-lg]="i === currentStep"
          [class.bg-gray-200]="i > currentStep"
          [class.text-gray-500]="i > currentStep"
        >
          @if (i < currentStep) {
            <span class="text-lg font-bold">✓</span>
          } @else {
            <span>{{ i + 1 }}</span>
          }
        </div>

        <!-- Label -->
        <div
          class="mt-3 text-sm text-center font-medium transition-colors duration-300"
          [class.text-accent]="i === currentStep"
          [class.text-gray-400]="i > currentStep"
          [class.text-green-600]="i < currentStep"
        >
          {{ step }}
        </div>

        <!-- Lijntje -->
        @if (i < steps.length - 2) {
          <div
            class="absolute top-6 left-[55%] w-[90%] h-[2px] z-[-1]"
            [class.bg-green-500]="i < currentStep"
            [class.bg-gray-300]="i >= currentStep"
          ></div>
        }
      </div>

    } @else {
      <!-- Laatste stap: resultaat -->
      <div class="flex flex-col items-center relative transition-all duration-300">
        <div
          class="flex items-center justify-center w-12 h-12 rounded-full transition-all duration-300"
          [class.bg-accent]="currentStep === steps.length - 1"
          [class.text-white]="currentStep === steps.length - 1"
          [class.shadow-lg]="currentStep === steps.length - 1"
          [class.bg-muted]="currentStep < steps.length - 1"
          [class.text-muted-foreground]="currentStep < steps.length - 1"
        >
          <lucide-icon
            name="trophy"
            class="w-6 h-6 transition-all duration-300"
            [class.scale-110]="currentStep === steps.length - 1"
          ></lucide-icon>
        </div>
        <div
          class="mt-3 text-sm font-medium transition-colors duration-300"
          [class.text-accent]="currentStep === steps.length - 1"
          [class.text-gray-400]="currentStep < steps.length - 1"
        >
          {{ step }}
        </div>
      </div>
    }

  }
</div>
