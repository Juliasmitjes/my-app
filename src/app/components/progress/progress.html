<div
  class="progress-track hidden sm:grid w-full max-w-5xl mx-auto py-4"
  [style.gridTemplateColumns]="'repeat(' + steps.length + ', 1fr)'"
>
  @for (step of steps; track step; let i = $index) {
    <div
      class="progress-step"
      [class.progress-step--done]="i < currentStep"
      [class.progress-step--active]="i === currentStep"
      [class.progress-step--todo]="i > currentStep"
    >
      <div class="progress-chip">
        <span class="progress-chip__badge">
          @if (i === steps.length - 1) {
            <lucide-icon
              name="trophy"
              class="w-4 h-4 transition-all duration-300 progress-trophy"
              [class.scale-110]="currentStep === steps.length - 1"
            ></lucide-icon>
          } @else {
            {{ i + 1 }}
          }
        </span>
        <div class="progress-chip__label">{{ step }}</div>
      </div>
    </div>
  }
</div>
