<h3 id="two-layout-top" class="text-xl sm:text-2xl font-bold mb-6 tracking-tight text-center">
  Service templates
</h3>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    @for (template of templates; track template.id) {
      <div
        class="relative p-4 rounded-2xl border border-border/40 bg-white/70 transition-all"
        [class.ring-2]="template.id === currentTemplate.id"
        [class.ring-accent]="template.id === currentTemplate.id"
      >
        <div class="flex items-start justify-between gap-3">
          <div class="space-y-2">
            <h3 class="text-base font-semibold">{{ template.label }}</h3>
          </div>
          <button
            type="button"
            class="px-3 py-1.5 rounded-xl text-sm font-semibold transition-colors duration-150 cursor-pointer"
            [class.bg-accent]="!(locked && template.id === currentTemplate.id && contentSaved)"
            [class.text-accent-foreground]="!(locked && template.id === currentTemplate.id && contentSaved)"
            [class.hover:shadow-md]="!(locked && template.id === currentTemplate.id && contentSaved)"
            [class.hover:scale-[1.02]]="!(locked && template.id === currentTemplate.id && contentSaved)"
            [class.shadow]="!(locked && template.id === currentTemplate.id && contentSaved)"
            [class.bg-muted/40]="locked && template.id === currentTemplate.id && contentSaved"
            [class.text-muted-foreground]="locked && template.id === currentTemplate.id && contentSaved"
            [class.border]="locked && template.id === currentTemplate.id && contentSaved"
            [class.border-border/60]="locked && template.id === currentTemplate.id && contentSaved"
            (click)="onTemplateAction(template, $event)"
          >
            {{ locked && template.id === currentTemplate.id ? (contentSaved ? 'Wijzig inhoud' : 'Opslaan') : 'Kies dit template' }}
          </button>
        </div>

        <button
          type="button"
          class="w-full text-left space-y-3 mt-4"
          (click)="selectTemplate(template)"
          [disabled]="locked"
        >
          @if (isFirstTemplate(template)) {
            <div class="rounded-2xl border border-border/40 bg-muted/20 overflow-hidden">
              <div class="px-4 py-3 bg-muted/40 border-b border-border/30">
                <div class="flex items-center justify-between text-xs text-muted-foreground">
                  <div class="flex items-center gap-3">
                    <div class="h-8 w-8 rounded-md border border-border/50 bg-white/70 flex items-center justify-center text-[10px] font-semibold text-foreground">
                      Logo
                    </div>
                    <span class="font-semibold text-foreground">Bedrijfsnaam</span>
                  </div>
                  <div class="flex items-center gap-4">
                    <span>Button</span>
                    <span>Button</span>
                    <span>Button</span>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-5 gap-0 border-t border-border/30">
                <div class="col-span-2 bg-slate-800 px-5 py-6 space-y-4 text-white">
                  @if (template.id === currentTemplate.id) {
                    @if (getTextContentForKey(getUploadKey(1)); as textBlock) {
                      <div class="space-y-2">
                        @if (textBlock.title) {
                          <div class="text-2xl font-semibold">{{ textBlock.title }}</div>
                        }
                        @if (textBlock.subtitle) {
                          <div class="text-sm text-white/80">{{ textBlock.subtitle }}</div>
                        }
                        @if (textBlock.body) {
                          <div class="text-xs text-white/70">{{ textBlock.body }}</div>
                        }
                      </div>
                    } @else {
                      <div class="text-2xl font-semibold">Jouw bedrijfsnaam</div>
                      <div class="text-sm text-white/80">Jouw subtitel</div>
                      <div class="text-xs text-white/70">Hier komt jouw tekst.</div>
                    }
                  } @else {
                    <div class="text-2xl font-semibold">Jouw bedrijfsnaam</div>
                    <div class="text-sm text-white/80">Jouw subtitel</div>
                    <div class="text-xs text-white/70">Hier komt jouw tekst.</div>
                  }
                  <div class="h-20 w-full border border-white/10 bg-white/10"></div>
                </div>
                <div class="col-span-3 bg-white border-l border-border/30">
                  <div class="w-full aspect-[16/9]">
                    @if (template.id === currentTemplate.id && getImagePreviewForKey(getUploadKey(2))) {
                      <img
                        class="w-full h-full object-cover"
                        [src]="getImagePreviewForKey(getUploadKey(2))"
                        alt=""
                      />
                    } @else {
                      <div class="w-full h-full flex items-center justify-center bg-muted/20">
                        <lucide-icon name="image" class="w-8 h-8 opacity-70"></lucide-icon>
                      </div>
                    }
                  </div>
                </div>
              </div>
              <div class="px-4 py-3 border-t border-border/30 bg-muted/40 text-xs text-muted-foreground">
                <div class="flex items-center justify-between">
                  <span>© 2026 Bedrijfsnaam</span>
                  <div class="flex items-center gap-4">
                    <span>Button</span>
                    <span>Button</span>
                    <span>Button</span>
                  </div>
                </div>
              </div>
            </div>
          } @else {
            <div class="grid grid-cols-2 gap-2">
              <div class="flex items-center justify-center p-3 rounded-xl bg-muted/40">
                @switch (template.col1Type) {
                  @case ('text') { <lucide-icon name="text-align-justify" class="w-6 h-6 opacity-70"></lucide-icon> }
                  @case ('image') { <lucide-icon name="image" class="w-6 h-6 opacity-70"></lucide-icon> }
                  @case ('video') { <lucide-icon name="video" class="w-6 h-6 opacity-70"></lucide-icon> }
                }
              </div>
              <div class="flex items-center justify-center p-3 rounded-xl bg-muted/40">
                @switch (template.col2Type) {
                  @case ('text') { <lucide-icon name="text-align-justify" class="w-6 h-6 opacity-70"></lucide-icon> }
                  @case ('image') { <lucide-icon name="image" class="w-6 h-6 opacity-70"></lucide-icon> }
                  @case ('video') { <lucide-icon name="video" class="w-6 h-6 opacity-70"></lucide-icon> }
                }
              </div>
            </div>
          }
        </button>

        @if (locked && template.id === currentTemplate.id) {
          <div
            class="absolute inset-0 z-20 bg-black/45 backdrop-blur-[30px]
                   flex items-center justify-center rounded-2xl"
            (click)="$event.stopPropagation()"
          >
            <div class="flex flex-col items-center gap-6">
              <div class="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4">
                <app-upload-unit
                  [locked]="locked"
                  [label]="col1Current.label"
                  [uploadKey]="getUploadKey(1)"
                  [uploads]="uploads"
                  [isSaved]="isSavedCol1"
                  [isComplete]="isUploadComplete(1)"
                  (requestUpload)="onRequestUpload(1, $event, col1Current.type)"
                  (requestClear)="onRequestClear(1, $event)"
                ></app-upload-unit>

                <app-upload-unit
                  [locked]="locked"
                  [label]="col2Current.label"
                  [uploadKey]="getUploadKey(2)"
                  [uploads]="uploads"
                  [isSaved]="isSavedCol2"
                  [isComplete]="isUploadComplete(2)"
                  (requestUpload)="onRequestUpload(2, $event, col2Current.type)"
                  (requestClear)="onRequestClear(2, $event)"
                ></app-upload-unit>
              </div>

              <div class="flex gap-3">
                <button
                  type="button"
                  (click)="onSaveClick(1, $event)"
                  class="px-5 py-2 rounded-xl font-semibold transition-all shadow-lg cursor-pointer"
                  [class.bg-accent]="isUploadComplete(1) && !isSavedCol1"
                  [class.text-accent-foreground]="isUploadComplete(1) && !isSavedCol1"
                  [class.bg-white/30]="isSavedCol1"
                  [class.text-white]="isSavedCol1"
                  [class.border]="isSavedCol1"
                  [class.border-white/40]="isSavedCol1"
                  [class.bg-white/40]="!isUploadComplete(1)"
                  [class.text-white/60]="!isUploadComplete(1)"
                  [class.backdrop-blur-sm]="!isUploadComplete(1)"
                >
                  {{ isSavedCol1 ? 'Wijzigen' : 'Opslaan' }}
                </button>

                <button
                  type="button"
                  (click)="onSaveClick(2, $event)"
                  class="px-5 py-2 rounded-xl font-semibold transition-all shadow-lg cursor-pointer"
                  [class.bg-accent]="isUploadComplete(2) && !isSavedCol2"
                  [class.text-accent-foreground]="isUploadComplete(2) && !isSavedCol2"
                  [class.bg-white/30]="isSavedCol2"
                  [class.text-white]="isSavedCol2"
                  [class.border]="isSavedCol2"
                  [class.border-white/40]="isSavedCol2"
                  [class.bg-white/40]="!isUploadComplete(2)"
                  [class.text-white/60]="!isUploadComplete(2)"
                  [class.backdrop-blur-sm]="!isUploadComplete(2)"
                >
                  {{ isSavedCol2 ? 'Wijzigen' : 'Opslaan' }}
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>


<ng-template>
  <app-upload-unit></app-upload-unit>
</ng-template>
