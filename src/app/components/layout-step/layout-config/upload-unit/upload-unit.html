<div class="flex flex-col items-center gap-2 sm:gap-4">

  @if (hasUpload) {
    <!-- Bestandsnaam -->
    <p class="text-sm text-white max-w-[160px] truncate text-center"
       [title]="fileName ?? 'Tekst toegevoegd'">
      {{ fileName ?? 'Tekst toegevoegd' }}
    </p>

    <!-- Wijzig-knop -->
    @if (!isSaved) {
      <button
        class="px-4 py-2 rounded-xl bg-white text-black shadow cursor-pointer"
        (click)="onUploadClick($event)"
      >
        Wijzig {{ label.toLowerCase() }}
      </button>
    }
  } @else {
    <!-- Upload-knop -->
    <button
      class="px-4 py-2 rounded-xl bg-white text-black shadow cursor-pointer"
      (click)="onUploadClick($event)"
    >
      Upload {{ label }}
    </button>
  }

</div>
