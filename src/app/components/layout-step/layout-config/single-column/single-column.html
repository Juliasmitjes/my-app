<div id="single-layout-top" class="space-y-12 w-full max-w-4xl mx-auto px-4 sm:px-6">

  <!-- Titel -->
  <div class="text-center space-y-1 sm:space-y-2">
    <h2 class="text-xl sm:text-2xl font-bold tracking-tight">Kies jouw indeling</h2>
  </div>

  <!-- Selectiekaart -->
  <div
    class="relative
           p-6 sm:p-10 rounded-3xl border border-border/40
           backdrop-blur-xl
           transition-all duration-300
           min-h-[280px] sm:min-h-0 overflow-hidden"
    (click)="!locked && nextOption()"
    [ngClass]="locked
      ? 'bg-muted/40 cursor-default opacity-80 hover:shadow-none hover:scale-100'
      : 'bg-white/70 cursor-pointer hover:shadow-xl hover:scale-[1.02]'"
    tabindex="0"
    (keydown.enter)="!locked && nextOption()"
    (keydown.space)="!locked && nextOption()"
  >

    <!-- OVERLAY BIJ LOCKED -->
    @if (locked) {
      <div
        class="absolute inset-0 z-20
               bg-black/30 backdrop-blur-sm
               flex items-center justify-center gap-4
               rounded-3xl"
        (click)="$event.stopPropagation()"
      >

        <button
          class="px-5 py-2.5 rounded-xl bg-white text-black shadow-lg font-semibold hover:scale-[1.03] transition"
          (click)="unlockLayoutFromChild.emit(); $event.stopPropagation()">
          Aanpassen
        </button>

        <button
          class="px-5 py-2.5 rounded-xl bg-accent text-accent-foreground shadow-lg font-semibold hover:scale-[1.03] transition"
          (click)="confirmLayoutFromChild.emit(); $event.stopPropagation()">
          Verder
        </button>

      </div>
    }

    <!-- Huidige optie -->
    <div class="flex justify-center mb-4 sm:mb-6">
      <div
        class="w-28 h-40 sm:w-32 sm:h-48 flex flex-col items-center justify-center
               gap-4 sm:gap-6 rounded-2xl p-4 sm:p-6
               transition-all duration-300
               ring-2 ring-accent shadow-lg"
      >

        @switch (currentOption.type) {

          @case ('image-text') {
            <div class="flex flex-col gap-2 sm:gap-4">
              <lucide-icon name="image" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
              <lucide-icon name="text-align-justify" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
            </div>
          }

          @case ('text-image') {
            <div class="flex flex-col gap-2 sm:gap-4">
              <lucide-icon name="text-align-justify" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
              <lucide-icon name="image" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
            </div>
          }

          @case ('text-video') {
            <div class="flex flex-col gap-2 sm:gap-4">
              <lucide-icon name="text-align-justify" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
              <lucide-icon name="video" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
            </div>
          }

          @case ('video-text') {
            <div class="flex flex-col gap-2 sm:gap-4">
              <lucide-icon name="video" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
              <lucide-icon name="text-align-justify" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
            </div>
          }

          @case ('text-only') {
            <lucide-icon name="text-align-justify" class="w-14 h-14 sm:w-20 sm:h-20 opacity-80"></lucide-icon>
          }

        }
      </div>
    </div>

    <!-- Titel -->
    <div class="text-center min-h-[3.5rem] sm:min-h-0">
      <h3 class="text-lg sm:text-xl font-semibold">{{ currentOption.label }}</h3>

      @if (!locked) {
        <!-- mobiel -->
        <p class="text-muted-foreground mt-1 text-xs 
          absolute left-1/2 -translate-x-1/2 w-[80%] text-center bottom-5
          block sm:hidden">
          Tik voor volgende optie
        </p>

        <!-- desktop -->
        <p class="text-muted-foreground mt-5 text-sm hidden sm:block">
          Klik voor volgende optie
        </p>
      }
    </div>

  </div>

</div>
