<h3 class="text-xl font-semibold mb-4">Indeling voor één kolom</h3>

<div class="grid grid-cols-2 md:grid-cols-3 gap-4">

  @for(option of columnOptions; track option.id) {
    <button
    (click)="select(option.id)"
    class="p-4 rounded-xl border flex flex-col items-center text-center hover:bg-muted transition"
    [class.bg-primary/10]="selectedOption === option.id"
  >
    <span class="font-medium text-sm">{{ option.label }}</span>

    @if(option.preview) {
       <img
      [src]="option.preview"
      alt="preview"
      class="mt-3 w-16 h-auto"
    />
    }   
  </button>
  }
  

</div>
