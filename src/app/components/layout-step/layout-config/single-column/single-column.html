<div class="space-y-12 w-full max-w-4xl mx-auto px-4 sm:px-6">

  <!-- Titel -->
  <div class="text-center space-y-2">
    <h2 class="text-3xl font-bold tracking-tight">Kies jouw indeling</h2>
    <p class="text-muted-foreground text-base">
      Klik om de verschillende lay-outopties te bekijken
    </p>
  </div>

  <!-- GROTE SELECTIE KNOP -->
  <div
    class="relative group cursor-pointer p-10 rounded-3xl border border-border/40 
           bg-white/70 dark:bg-muted/40 backdrop-blur-xl shadow-sm transition-all 
           hover:shadow-xl hover:scale-[1.02]"
    (click)="nextOption()"
    role="button"
    tabindex="0"
    (keydown.enter)="nextOption()"
    (keydown.space)="nextOption()"
  >

    <!-- Preview icoon afhankelijk van optie -->
    <div class="flex justify-center mb-6">

      @switch (currentOption.type) {

        @case ('image-text') {
          <div class="flex gap-6">
            <lucide-icon name="image" class="w-20 h-20 opacity-80"></lucide-icon>
            <lucide-icon name="text-align-justify" class="w-20 h-20 opacity-80"></lucide-icon>
          </div>
        }

        @case ('text-image') {
          <div class="flex gap-6">
            <lucide-icon name="text-align-justify" class="w-20 h-20 opacity-80"></lucide-icon>
            <lucide-icon name="image" class="w-20 h-20 opacity-80"></lucide-icon>
          </div>
        }

        @case ('text-video') {
          <div class="flex gap-6">
            <lucide-icon name="text-align-justify" class="w-20 h-20 opacity-80"></lucide-icon>
            <lucide-icon name="video" class="w-20 h-20 opacity-80"></lucide-icon>
          </div>
        }

        @case ('video-text') {
          <div class="flex gap-6">
            <lucide-icon name="video" class="w-20 h-20 opacity-80"></lucide-icon>
            <lucide-icon name="text-align-justify" class="w-20 h-20 opacity-80"></lucide-icon>
          </div>
        }

        @case ('text-only') {
          <div class="flex gap-6">
            <lucide-icon name="text-align-justify" class="w-24 h-24 opacity-80"></lucide-icon>
          </div>
        }

      }

    </div>

    <!-- Titel onder de preview -->
    <div class="text-center">
      <h3 class="text-xl font-semibold">{{ currentOption.label }}</h3>
      <p class="text-muted-foreground mt-1 text-sm">
        Klik om naar de volgende indeling te gaan
      </p>
    </div>

  </div>

</div>
