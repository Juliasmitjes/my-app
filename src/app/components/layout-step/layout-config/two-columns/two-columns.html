<h3 class="text-xl font-semibold mb-4">Indeling voor twee kolommen</h3>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <!-- Kolom 1 -->
  <div>
    <h4 class="font-medium mb-2">Kolom 1</h4>
    <select
      class="w-full p-2 border rounded"
      [(ngModel)]="col1"
      (change)="emit()"
    >
      <option value="text">Tekst</option>
      <option value="image">Afbeelding</option>
      <option value="video">Video</option>
    </select>
  </div>

  <!-- Kolom 2 -->
  <div>
    <h4 class="font-medium mb-2">Kolom 2</h4>
    <select
      class="w-full p-2 border rounded"
      [(ngModel)]="col2"
      (change)="emit()"
    >
      <option value="text">Tekst</option>
      <option value="image">Afbeelding</option>
      <option value="video">Video</option>
    </select>
  </div>

</div>
