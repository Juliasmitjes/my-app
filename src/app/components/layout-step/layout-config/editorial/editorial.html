<div id="single-layout-top" class="space-y-8 w-full max-w-4xl mx-auto px-4 sm:px-6">

  <div class="text-center space-y-1 sm:space-y-2">
    <h2 class="text-xl sm:text-2xl font-bold tracking-tight">Kies een template</h2>
    <p class="text-muted-foreground text-sm">Selecteer een simpele, passende indeling.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    @for (option of layoutOptions; track option.id) {
      <div
        class="relative p-4 rounded-2xl border border-border/40 bg-white/70 transition-all"
        [class.ring-2]="option.id === currentOption.id"
        [class.ring-accent]="option.id === currentOption.id"
      >
        <button
          type="button"
          class="w-full text-left space-y-3"
          (click)="selectOption(option)"
          [disabled]="locked"
        >
          <div class="flex items-center gap-2">
            @for (item of option.preview; track item) {
              @switch (item) {
                @case ('text') {
                  <lucide-icon name="text-align-justify" class="w-6 h-6 opacity-70"></lucide-icon>
                }
                @case ('image') {
                  <lucide-icon name="image" class="w-6 h-6 opacity-70"></lucide-icon>
                }
                @case ('video') {
                  <lucide-icon name="video" class="w-6 h-6 opacity-70"></lucide-icon>
                }
              }
            }
          </div>
          <div>
            <h3 class="text-base font-semibold">{{ option.label }}</h3>
          </div>
        </button>

        @if (locked && option.id === currentOption.id) {
          <div
            class="absolute inset-0 z-20 bg-black/45 backdrop-blur-[30px]
                   flex items-center justify-center rounded-2xl"
            (click)="$event.stopPropagation()"
          >
            <div class="flex flex-col items-center gap-6">
              <div class="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4">
                @for (btn of overlayButtons; track btn.label) {
                  <app-upload-unit
                    [locked]="locked"
                    [label]="btn.label"
                    [uploadKey]="getUploadKey(btn)"
                    [uploads]="uploads"
                    [isSaved]="isSaved"
                    [isComplete]="isUploadComplete()"
                    [compact]="true"
                    (requestUpload)="onRequestUpload($event, btn.type)"
                    (requestClear)="onRequestClear($event)"
                  ></app-upload-unit>
                }
              </div>

              <button
                type="button"
                (click)="onSaveClick($event)"
                class="px-6 py-3 rounded-xl font-semibold transition-all shadow-lg cursor-pointer"
                [class.bg-accent]="isUploadComplete() && !isSaved"
                [class.text-accent-foreground]="isUploadComplete() && !isSaved"
                [class.bg-white/30]="isSaved"
                [class.text-white]="isSaved"
                [class.border]="isSaved"
                [class.border-white/40]="isSaved"
                [class.bg-white/40]="!isUploadComplete()"
                [class.text-white/60]="!isUploadComplete()"
                [class.backdrop-blur-sm]="!isUploadComplete()"
              >
                {{ isSaved ? 'Wijzigen' : 'Opslaan' }}
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>

<ng-template>
  <app-upload-unit></app-upload-unit>
</ng-template>
