<h3 class="text-2xl font-bold mb-6 tracking-tight text-center">
  Grid indeling
</h3>

<!-- Input panel -->
<div
  class="flex items-center justify-center gap-8 mb-10
         bg-white/60 dark:bg-muted/30 backdrop-blur-sm
         border border-border/40 rounded-3xl p-6 shadow-sm"
>
  <!-- Rijen -->
  <div class="flex flex-col text-center space-y-2">
    <label class="text-sm font-medium text-muted-foreground">
      Rijen
    </label>
    <input
      type="number"
      min="1"
      max="6"
      class="w-24 px-3 py-2 rounded-xl border border-gray-300 bg-white/80
             focus:outline-none focus:ring-2 focus:ring-accent/40
             transition-all text-center dark:bg-muted/30 dark:border-muted/40"
      [(ngModel)]="rows"
      (change)="updateGrid()"
    />
  </div>

  <!-- Kolommen -->
  <div class="flex flex-col text-center space-y-2">
    <label class="text-sm font-medium text-muted-foreground">
      Kolommen
    </label>
    <input
      type="number"
      min="1"
      max="6"
      class="w-24 px-3 py-2 rounded-xl border border-gray-300 bg-white/80
             focus:outline-none focus:ring-2 focus:ring-accent/40
             transition-all text-center dark:bg-muted/30 dark:border-muted/40"
      [(ngModel)]="cols"
      (change)="updateGrid()"
    />
  </div>
</div>

<!-- Grid -->
<div
  class="grid gap-6 overflow-visible"
  [style.gridTemplateColumns]="'repeat(' + cols + ', 1fr)'"
>
  @for (cell of grid; let i = $index; track i) {
    <div
      class="p-5 rounded-2xl border border-gray-300 bg-white/60 dark:bg-muted/30
             backdrop-blur-sm shadow-sm transition-all
             hover:shadow-lg hover:-translate-y-1 hover:bg-white/90 dark:hover:bg-muted/40 relative overflow-visible"
    >
      <!-- Custom dropdown -->
      <div class="relative w-full">
        <button
          (click)="toggle(i)"
          class="w-full rounded-xl border border-gray-300 bg-white/80 p-3 text-left
                 text-sm font-medium text-muted-foreground cursor-pointer
                 focus:outline-none focus:ring-2 focus:ring-accent/40
                 transition-all flex items-center justify-between
                 dark:bg-muted/30 dark:border-muted/40"
        >
          <span>{{ cell.labelMap[cell.value] }}</span>
          <lucide-icon name="chevron-down"></lucide-icon>
        </button>

        @if (cell.open) {
          <ul
  class="absolute z-[9999] mt-2 w-full rounded-xl border border-gray-300 bg-white shadow-lg
         dark:bg-muted/30 dark:border-muted/40"
>

            @for (option of options; track option) {
              <li
                (click)="setCellValue(i, option)"
                class="p-3 text-sm hover:bg-accent/10 cursor-pointer transition-all flex items-center gap-2"
              >
                @if (option === 'text') { <span>📝</span> }
                @if (option === 'image') { <span>🖼️</span> }
                @if (option === 'video') { <span>🎥</span> }
                <span>{{ cell.labelMap[option] }}</span>
              </li>
            }
          </ul>
        }
      </div>
    </div>
  }
</div>
