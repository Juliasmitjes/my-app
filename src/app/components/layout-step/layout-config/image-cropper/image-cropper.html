<div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-white/90 backdrop-blur-xl p-6 rounded-3xl shadow-xl w-[90%] max-w-2xl space-y-6">

    <h3 class="text-lg font-semibold text-center">Foto bijsnijden</h3>
    <p class="text-sm text-muted-foreground text-center">
      Alleen het deel binnen het witte vierkant wordt opgeslagen.
    </p>

    <div class="w-full max-w-xl mx-auto h-[400px] overflow-hidden rounded-xl relative bg-neutral-900">
      <img #imageElement />
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <button class="px-4 py-2 rounded-xl bg-muted/60" (click)="cancel.emit()">Annuleren</button>
      <button class="px-4 py-2 rounded-xl bg-accent text-accent-foreground" (click)="saveCrop()">Opslaan</button>
    </div>

  </div>
</div>
