<div class="space-y-8">

  @for (slot of slots; track slot.id) {

    <div class="p-6 border border-border/40 rounded-2xl bg-white/70 shadow-sm">

      <h3 class="font-semibold text-lg mb-4">{{ slot.label }}</h3>

      <!-- IMAGE / VIDEO UPLOAD -->
      @if (slot.type !== 'text') {
        <label class="block w-full cursor-pointer">
          <input 
            type="file"
            class="hidden"
            [accept]="slot.type === 'image' ? 'image/*' : 'video/*'"
            (change)="onFileUpload($event, slot)"
          >

          <div class="px-4 py-3 rounded-xl bg-accent text-accent-foreground 
                      font-medium text-center cursor-pointer hover:scale-[1.02] 
                      transition shadow">
            Upload {{ slot.type === 'image' ? 'afbeelding' : 'video' }}
          </div>
        </label>

        @if (slot.value) {
          <p class="text-sm text-muted-foreground mt-2">
            Bestand: {{ slot.value.name }}
          </p>
        }
      }

      <!-- TEXT SLOT -->
      @if (slot.type === 'text') {

        <!-- Tekst upload -->
        <label class="block w-full cursor-pointer">
          <input 
            type="file"
            class="hidden"
            accept=".txt,.md"
            (change)="onFileUpload($event, slot)"
          >

          <div class="px-4 py-3 rounded-xl bg-accent text-accent-foreground 
                      font-medium text-center cursor-pointer hover:scale-[1.02] 
                      transition shadow mb-3">
            Upload tekstbestand
          </div>
        </label>

        <!-- OF tekst typen -->
        <button
          class="px-4 py-2 rounded-xl bg-muted text-foreground 
                 border border-border/40 shadow hover:scale-[1.02]
                 transition w-full"
          (click)="openTyping(slot)"
        >
          Typ tekst
        </button>

        @if (typingSlot === slot.id) {
          <div class="mt-4">
            <textarea 
              [(ngModel)]="typedText"
              class="w-full p-3 rounded-xl border border-border/40"
              rows="5"
              placeholder="Typ hier jouw tekst..."
            ></textarea>

            <button
              class="mt-3 px-4 py-2 rounded-xl bg-accent text-accent-foreground 
                     font-semibold hover:scale-[1.02] transition shadow"
              (click)="confirmText(slot)"
            >
              Bevestigen
            </button>
          </div>
        }

        @if (slot.value && typingSlot !== slot.id) {
          <p class="text-sm text-muted-foreground mt-2">
            Tekst opgeslagen
          </p>
        }
      }
    </div>

  }
</div>
