<nav
  [ngClass]="isScrolled 
    ? 'bg-muted/50 backdrop-blur-md shadow-elegant' 
    : 'sm:bg-transparent sm:backdrop-blur-none backdrop-blur-md bg-muted/50'"
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
>
  <div class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">

      <!-- linksboven -->
      <div 
        class="text-2xl font-bold font-business text-accent-warm cursor-pointer hover:text-accent/80 transition-colors"
        (click)="scrollToSection('hero')">
        Home
      </div>

      <!-- dekstop navigatie -->
      <div class="hidden md:flex space-x-8">
        @for (item of navItems; track item.id) {
          <button
            (click)="scrollToSection(item.id)" 
            class="text-muted-foreground hover:text-primary font-business font-semibold transition-all duration-300 hover:scale-105 cursor-pointer"
          >
            {{ item.label }}
          </button>
        }
      </div>

      <!-- mobiel menu -->
      <button
        class="md:hidden p-2 font-business text-foreground hover:text-primary transition-colors"
        (click)="toggleMobileMenu()">
        @if (isMobileMenuOpen) {
          <lucide-icon name="x" [size]="24"></lucide-icon>
        } @else {
          <lucide-icon name="menu" [size]="24"></lucide-icon>
        }
      </button>
    </div>

    @if (isMobileMenuOpen) {
      <div class="md:hidden mt-4 pb-4 border-t border-border">
        <div class="flex flex-col space-y-4 pt-4">
          @for (item of navItems; track item.id) {
            <button 
              (click)="scrollToSection(item.id)" 
              class="text-left font-business text-foreground hover:text-primary font-semibold transition-colors py-2">
              {{ item.label }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</nav>
