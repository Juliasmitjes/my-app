<div class="space-y-6">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold mb-2">Pages & Content</h2>
    <p class="text-muted-foreground">Choose which pages to include (max 3 additional)</p>
  </div>

  <app-card>
    <app-card-header>
      <app-card-title class="flex items-center gap-2">
        <lucide-icon name="FileText" class="w-5 h-5"></lucide-icon>
        Page Selection
      </app-card-title>
    </app-card-header>

    <app-card-content class="space-y-4">
      <!-- Always included Home -->
      <div class="flex items-center space-x-2 p-3 bg-gradient-subtle rounded-lg">
        <lucide-icon name="CircleCheck" class="w-5 h-5 text-primary"></lucide-icon>
        <app-label class="font-medium">Home (Always included)</app-label>
      </div>

      <!-- Loop over other available pages provided via contents input -->
     @for (page of contents; track page) {
        <div class="flex items-center space-x-2 p-3 border rounded-lg">
          <input
            type="checkbox"
            [id]="page"
            [checked]="pages.includes(page)"
            (change)="onSelectPage(page)"
            [disabled]="!pages.includes(page) && pages.length >= 4"
          />
          <app-label [for]="page" class="capitalize font-medium">{{ page }}</app-label>
        </div>
      }

     <p class="text-sm text-muted-foreground">
        {{ pages.length - 1 }}/3 additional pages selected
      </p>

    </app-card-content>
  </app-card>
</div>
