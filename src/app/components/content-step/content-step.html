<div class="animate-fade-in space-y-8">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold mb-2">Pages & Content</h2>
    <p class="text-muted-foreground mb-6">
      Choose which pages to include (max 4 total)
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (page of availablePages; track page.id) {
      <app-card class="p-6 transition-all duration-300">
        <div class="flex items-start gap-4">
          <input
            type="checkbox"
            [id]="page.id"
            class="accent-primary mt-1"
            [checked]="isSelected(page.id)"
            [disabled]="isDisabled(page)"
            (change)="!page.required && togglePage(page.id)"
          />

          <div class="flex-1">
            <Label
              [for]="page.id"
              class="flex items-center gap-2 cursor-pointer"
            >
              <lucide-icon
                [name]="page.icon"
                class="w-5 h-5 text-foreground"
              ></lucide-icon>

              <span class="font-semibold">{{ page.name }}</span>

              @if (page.required) {
                <span class="text-xs text-muted-foreground">
                  (Required)
                </span>
              }
            </Label>

            <p class="text-sm text-muted-foreground mt-1">
              {{ page.description }}
            </p>
          </div>
        </div>
      </app-card>
    }
  </div>

  @if (builderState.pages.length >= 4) {
    <p class="text-sm text-muted-foreground mt-4 text-center">
      Maximum 4 pages reached
    </p>
  }
</div>
