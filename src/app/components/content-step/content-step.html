<div class="space-y-6">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold mb-2">Pages & Content</h2>
    <p class="text-muted-foreground">Choose which pages to include (max 3 additional)</p>
  </div>

  <app-card>
    <app-card-header>
      <app-card-title class="flex items-center gap-2">
        <lucide-icon name="file-text" class="w-5 h-5"></lucide-icon>
        Page Selection
      </app-card-title>
    </app-card-header>

    <app-card-content class="space-y-4">
      <!-- Toon elk gestructureerd item -->
      @for (item of contents; track item.id) {
        <div class="flex items-start gap-3 p-3 border rounded-lg">
          <input
            type="checkbox"
            [id]="item.id"
            [checked]="pages.includes(item.id)"
            (change)="onSelectPage(item.id, item.required)"
            [disabled]="item.required || (!pages.includes(item.id) && pages.length >= 4)"
          />

          <div class="flex-1">
            <label [for]="item.id" class="flex items-center gap-2 cursor-pointer">
              @if (item.icon) {
                <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
              }
              <span class="font-medium capitalize">{{ item.name }}</span>
              @if (item.required) {
                <span class="text-xs text-muted-foreground ml-2">(Required)</span>
              }
            </label>

            <p class="text-sm text-muted-foreground mt-1">{{ item.description }}</p>
          </div>
        </div>
      }

      <p class="text-sm text-muted-foreground">
        {{ pages.length - 1 }}/3 additional pages selected
      </p>
    </app-card-content>
  </app-card>
</div>
