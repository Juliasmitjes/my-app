<div class="step-container min-h-screen flex flex-col justify-center items-center text-center space-y-10">
  <!-- Titel -->
  <div>
    <h2 class="text-2xl font-bold mb-2">Selecteer pagina's</h2>
  </div>

  <!-- Kaart -->
  <div
    class="w-full max-w-3xl mx-auto bg-white/60 dark:bg-muted/30 backdrop-blur-sm rounded-3xl p-8 shadow-sm flex flex-col items-center border border-border/50"
  >

    <!-- Opties -->
    <div class="space-y-4 w-full max-w-md mx-auto text-left max-h-[60vh] overflow-y-auto pr-2">
      @for (item of contents; track item.id) {
        <label
          for="page-{{ item.id }}"
          class="flex items-start gap-4 p-4 rounded-2xl border border-border/50 bg-background/40 hover:bg-accent/5 transition cursor-pointer w-full"
        >
          <input
            id="page-{{ item.id }}"
            type="checkbox"
            class="mt-1 accent-accent h-4 w-4"
            [checked]="pages.includes(item.id)"
            [disabled]="item.required"
            (change)="onSelectPage(item.id, item.required)"
          />

          <div class="flex-1">
            <div class="flex items-center gap-2">
              @if (item.icon) {
                <lucide-icon
                  [name]="item.icon"
                  class="w-5 h-5 text-accent">
                </lucide-icon>
              }
              <span class="font-medium text-foreground">{{ item.name }}</span>
              @if (item.required) {
                <span class="text-xs text-muted-foreground ml-2">(verplicht)</span>
              }
            </div>

            <p class="text-sm text-muted-foreground mt-1">
              {{ item.description }}
            </p>

            @if (pages.includes(item.id)) {
              <div class="mt-3 flex items-center gap-3">
                @if (!isConfirmed(item.id)) {
                  <button
                    type="button"
                    class="px-3 py-1 text-xs rounded-md border"
                    (click)="confirmPage(item.id, $event)"
                  >
                    Bevestigen
                  </button>
                } @else {
                  <button
                    type="button"
                    class="px-3 py-1 text-xs rounded-md border"
                    (click)="openEditor(item, $event)"
                  >
                    Invullen
                  </button>
                }
              </div>
            }
          </div>
        </label>

      }

      <!-- Teller -->
      <div class="text-center mt-6">
        <p class="text-sm text-muted-foreground">
          <span class="font-medium text-foreground">
            {{ additionalPagesCount }}
          </span>
          extra pagina's geselecteerd
        </p>
      </div>
    </div>
  </div>

  <app-page-content-modal
    [visible]="showModal"
    [page]="activePage"
    [builderState]="builderState!"
    [colorThemes]="colorThemes"
    (dismiss)="closeEditor()"
    (save)="savePageContent($event)"
  ></app-page-content-modal>
</div>
