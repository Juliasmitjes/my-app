 <div className="space-y-6">
  <div className="text-center mb-8">
    <h2 className="text-2xl font-bold mb-2">Pages & Content</h2>
    <p className="text-muted-foreground">Choose which pages to include (max 3 additional)</p>
  </div>
  
  <app-card>
    <app-card-header>
      <app-card-title className="flex items-center gap-2">
        <lucide-icon name="file-text" class="w-5 h-5"></lucide-icon>
        Page Selection
      </app-card-title>
    </app-card-header>

    <app-card-content className="space-y-4">
      <div className="flex items-center space-x-2 p-3 bg-gradient-subtle rounded-lg">
        <ludide-icon name="check-circle" class="w-5 h-5 text-primary"></lucide-icon>
        <app-label className="font-medium">Home (Always included)</app-label>
      </div>
      

      
    @for (page of contents; track page) {  
      <div class="flex items-center space-x-2 p-3 border rounded-lg">       
        <input
          type="checkbox"
          [id]="page"
          [checked]="builderState.pages.includes(page)"
          (change)="onSelectPage(page)"
          [disabled]="
            !builderState.pages.includes(page) &&
            builderState.pages.length >= 4
          "/>

        <app-label [for]="page" class="capitalize font-medium">
          {{ page }}
        </app-label>
      </div>}
      
      <p className="text-sm text-muted-foreground">
        {builderState.pages.length - 1}/3 additional pages selected
      </p>
    </CardContent>
  </Card>
</div>
