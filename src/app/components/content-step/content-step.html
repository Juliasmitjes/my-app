<div class="step-container w-full max-w-6xl mx-auto flex flex-col items-center text-center space-y-8 px-4 sm:px-6">
  <!-- Titel -->
  <div>
    <h2 class="text-2xl font-bold mb-2">Selecteer pagina's</h2>
  </div>

  <div class="w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 md:gap-4 text-left">
      @for (item of contents; track item.id) {
        <label
          for="page-{{ item.id }}"
          class="content-option-card flex items-start gap-3 p-3 rounded-[1rem] transition cursor-pointer w-full min-h-[132px]"
          [class.content-option-card--selected]="pages.includes(item.id)"
        >
          <input
            id="page-{{ item.id }}"
            type="checkbox"
            class="mt-1 accent-accent h-4 w-4"
            [checked]="pages.includes(item.id)"
            [disabled]="item.required"
            (change)="onSelectPage(item.id, item.required)"
          />

          <div class="flex-1">
            <div class="flex items-center gap-2">
              @if (item.icon) {
                <lucide-icon
                  [name]="item.icon"
                  class="w-4 h-4 text-accent">
                </lucide-icon>
              }
              <span class="text-[0.95rem] font-medium text-foreground">{{ item.name }}</span>
              @if (item.required) {
                <span class="text-xs text-muted-foreground ml-2">(verplicht)</span>
              }
            </div>

            <p class="text-[0.95rem] text-muted-foreground mt-1">
              {{ item.description }}
            </p>

            @if (pages.includes(item.id) && !item.required) {
              <div class="mt-4 flex items-center gap-2">
                <button
                  type="button"
                  class="content-option-card__action"
                  (click)="openEditor(item, $event)"
                >
                  Invullen
                </button>
              </div>
            }
          </div>
        </label>

      }

      <!-- Teller -->
      <div class="text-center mt-2 xl:col-span-3">
        <p class="text-sm text-muted-foreground">
          <span class="font-medium text-foreground">
            {{ additionalPagesCount }}
          </span>
          extra pagina's geselecteerd
        </p>
      </div>
    </div>
  </div>

  <app-page-content-modal
    [visible]="showModal"
    [page]="activePage"
    [builderState]="builderState!"
    [colorThemes]="colorThemes"
    (dismiss)="closeEditor()"
    (save)="savePageContent($event)"
  ></app-page-content-modal>
</div>
