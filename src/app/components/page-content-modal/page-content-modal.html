@if (visible) {
  <div class="fixed inset-0 z-50 flex items-center justify-center px-4 py-6">
    <div class="absolute inset-0 bg-black/35 backdrop-blur-xl" (click)="close()"></div>

    <div class="page-content-modal relative w-full max-w-3xl max-h-[92vh] overflow-hidden rounded-[28px] bg-white">
      <div class="page-content-modal__header">
        <div>
          <p class="page-content-modal__eyebrow">Pagina invullen</p>
          <h2 class="page-content-modal__title">{{ page?.name }}</h2>
        </div>
        <button type="button" class="page-content-modal__close" aria-label="Sluiten" (click)="close()">×</button>
      </div>

      <div class="page-content-modal__body">
        <app-page-content-editor [modal]="modalContext"></app-page-content-editor>
      </div>
    </div>
  </div>
}
