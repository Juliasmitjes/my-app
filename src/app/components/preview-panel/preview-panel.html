<!-- preview-panel.html -->
 @if (open){
  <div class="preview-overlay">
  <div class="backdrop" (click)="close()"></div>

      <aside class="panel pb-20 flex flex-col" [ngClass]="size" role="dialog" aria-label="Live preview">
        <header class="p-4 flex items-center justify-end">
        <div class="panel-actions">
          <button
            class="px-3 py-2 text-sm font-medium rounded-md border border-border hover:bg-accent/20 hover:text-accent transition cursor-pointer"
            (click)="close()"
          >
            Voorbeeld sluiten
          </button>
        </div>
      </header>

    <app-preview-step
      [builderState]="builderState!"
      iconName="monitor"
      title="Live Preview"
      class="preview-component">
    </app-preview-step>
  </aside>
</div>
 }
