<div class="space-y-6">
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold mb-2">Choose Your Colors</h2>
    <p class="text-muted-foreground">Pick a color theme that matches your brand</p>
  </div>

  <div class="grid md:grid-cols-2 gap-6">
    @for (theme of themes; track theme.id) {
      <app-option-card
        [title]="theme.name"
        description="Background, buttons, and accents automatically adjust"
        [selected]="builderState.colorTheme === theme.id"
        (clickCard)="updateState({ colorTheme: theme.id })"
      >
        <div class="flex space-x-1 p-3" preview>
          @for (color of theme.colors; track $index) {
            <div
              class="w-full h-8 rounded"
              [style.background-color]="color"
            ></div>
          }
        </div>
      </app-option-card>
    }
  </div>
</div>
