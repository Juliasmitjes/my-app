<div class="space-y-8 step-container">
  <!-- Titel -->
  <div class="text-center mb-8">
    <h2 class="text-3xl font-bold mb-6 tracking-tight">
      Kies een kleurenpalet
    </h2>
  </div>

  <!-- Thema's -->
  <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (theme of themes; track theme.id) {
      <div class="flex flex-col items-center text-center space-y-4">
        <!-- Mockup voorbeeld -->
        <div
          class="color-theme-preview w-full rounded-[1.75rem] overflow-hidden transition-all duration-300 cursor-pointer"
          [class.ring-2]="builderState.colorTheme === theme.id"
          [class.ring-accent]="builderState.colorTheme === theme.id"
          [class.shadow-lg]="builderState.colorTheme === theme.id"
          [class.color-theme-preview--selected]="builderState.colorTheme === theme.id"
          (click)="onSelectTheme(theme.id)"
          role="button"
          tabindex="0"
          (keydown.enter)="onSelectTheme(theme.id)"
          (keydown.space)="onSelectTheme(theme.id)"
          aria-pressed="{{ builderState.colorTheme === theme.id }}"
        >
          <div class="h-10 flex">
            <div class="flex-1" [style.background]="theme.colors[1]"></div>
            <div class="flex-1" [style.background]="theme.colors[9]"></div>
            <div class="flex-1" [style.background]="theme.colors[7]"></div>
          </div>

          <div class="bg-white/90 p-4 text-left space-y-3">
            <div class="h-3 w-2/3 rounded-full" [style.background]="theme.colors[5]"></div>
            <div class="h-3 w-1/2 rounded-full" [style.background]="theme.colors[4]"></div>
            <div class="pt-2">
              <div
                class="inline-block px-2 py-1 text-xs rounded border text-left"
                [style.background]="theme.colors[7]"
                [style.color]="theme.colors[8]"
                [style.borderColor]="theme.colors[9]"
              >
                Button
              </div>
            </div>
          </div>
        </div>

        <!-- Naam -->
        <div class="w-full">
          <p class="theme-title text-lg font-semibold tracking-tight">
            {{ theme.name }}
          </p>
        </div>

        <!-- Mini kleurbolletjes -->
        <div class="w-full flex justify-center gap-2 mt-1">
          @for (color of theme.colors; track $index) {
            <div
              class="mini-dot"
              [style.background]="color"
            ></div>
          }
        </div>
      </div>
    }
  </div>
</div>
